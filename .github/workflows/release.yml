name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compilation tools
        if: matrix.arch == 'arm64'
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ $(lsb_release -cs) main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ $(lsb_release -cs)-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          sudo apt-get install -y \
            libraw1394-dev:arm64 \
            libavc1394-dev:arm64 \
            libiec61883-dev:arm64 \
            libdv4-dev:arm64 \
            libjpeg-dev:arm64 \
            linux-libc-dev:arm64

      - name: Install native dependencies
        if: matrix.arch == 'amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake pkg-config \
            libraw1394-dev \
            libavc1394-dev \
            libiec61883-dev \
            libdv4-dev \
            libjpeg-dev \
            linux-libc-dev

      - name: Install build tools
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get install -y autoconf automake pkg-config

      - name: Build
        run: |
          autoreconf -fi
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            export CC=aarch64-linux-gnu-gcc
            export CXX=aarch64-linux-gnu-g++
            export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
            ./configure --host=aarch64-linux-gnu --without-libquicktime
          else
            ./configure --without-libquicktime
          fi
          make -j$(nproc)

      - name: Package binary
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p dvgrab-${VERSION}-linux-${{ matrix.arch }}
          cp dvgrab dvgrab-${VERSION}-linux-${{ matrix.arch }}/
          cp README COPYING dvgrab.1 dvgrab-${VERSION}-linux-${{ matrix.arch }}/
          tar czf dvgrab-${VERSION}-linux-${{ matrix.arch }}.tar.gz dvgrab-${VERSION}-linux-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dvgrab-linux-${{ matrix.arch }}
          path: dvgrab-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create source tarball
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          autoreconf -fi
          ./configure
          make dist
        continue-on-error: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dvgrab-*.tar.gz
